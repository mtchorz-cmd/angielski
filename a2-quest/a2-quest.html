<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>A2 Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
@page { size: A4; margin: 0; }
:root{
  --parch:#F7F6F2; --sea:#E1EBF6; --ink:#2A3140; --ink2:#5E6B80; --ink3:#9AA6B8;
  --red:#3768D8; --gold:#3768D8; --hair:#D5DDE8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--parch);-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:Onest,system-ui,sans-serif;color:var(--ink);font-size:10.5px;line-height:1.42}
.page{width:210mm;height:297mm;position:relative;overflow:hidden;background:var(--parch);page-break-after:always}
.page:last-of-type{page-break-after:auto}
.en{font-style:normal}
[lang=en]{hyphens:manual}

/* ---------- MAPA ---------- */
.map svg{position:absolute;inset:0;width:100%;height:100%}
.cin{font-family:Cinzel,serif}

/* ---------- ETAP ---------- */
.stage{padding:46px 54px 40px;display:flex;flex-direction:column;background:#FBFAF7}
.nav{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
.nav a{color:var(--red);text-decoration:none}
.nav .meta{color:var(--ink2);font-weight:600}
.head{display:flex;align-items:flex-end;gap:22px;margin-top:20px}
.head .num{font-family:Cinzel,serif;font-weight:700;font-size:64px;line-height:.8;color:var(--red)}
.head h1{font-family:Cinzel,serif;font-weight:700;font-size:34px;line-height:1;letter-spacing:.01em;white-space:nowrap}
.head .sub{font-size:12.5px;color:var(--ink2);margin-top:6px}
.head .sub b{color:var(--ink)}
.head svg{margin-left:auto;flex:none}
.rule{height:12px;margin:16px 0 14px;background:
  linear-gradient(var(--ink),var(--ink)) left center/calc(50% - 12px) 1px no-repeat,
  linear-gradient(var(--ink),var(--ink)) right center/calc(50% - 12px) 1px no-repeat;position:relative}
.rule::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;background:var(--red);transform:translate(-50%,-50%) rotate(45deg)}
.quest{font-size:12px;line-height:1.5;color:var(--ink);max-width:560px}
.quest b{color:var(--red)}
h2{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--red);display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
h2 small{font-weight:600;letter-spacing:.02em;text-transform:none;color:var(--ink2);font-size:10px}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:34px;margin-top:22px}
.item{display:flex;gap:9px;align-items:flex-start;padding:6px 0}
.item + .item{border-top:1px dashed var(--hair)}
.item .t{font-weight:700;font-size:11px}
.item .ex{color:var(--ink2);font-size:10.3px;margin-top:1px}
.item .ex i{font-style:normal;color:var(--ink)}
.cb{flex:none;width:12px;height:12px;border:1.3px solid var(--ink);border-radius:2px;margin-top:1px;background:transparent}
.cb.lg{width:15px;height:15px}
.challenge{margin-top:18px}
.challenge p{font-size:10.5px}
.tf{display:inline-block;height:15px;border-bottom:1.1px dotted var(--ink2);vertical-align:bottom}
.line{padding-right:74px;display:flex;align-items:flex-end;gap:7px;margin-top:8px;font-size:10px;color:var(--ink2)}
.line .tf{flex:1}
.loot{margin-top:24px}
.words{display:grid;grid-template-columns:1fr 1fr 1.22fr;column-gap:22px}
.wh{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);padding-bottom:3px;border-bottom:1px solid var(--ink)}
.w{display:grid;grid-template-columns:13px 1fr;gap:7px;align-items:start;padding:3.4px 0;border-bottom:1px dashed var(--hair);font-size:10px;line-height:1.25}
.w b{display:block}
.w .cb{margin-top:1px}
.w b{font-weight:700}
.w div span{color:var(--ink2);font-size:9.2px}
.gate{margin-top:auto;display:grid;grid-template-columns:86px 1fr;gap:20px;align-items:start}
.tally{display:flex;gap:4px;flex-wrap:wrap;align-items:flex-end;font-size:10.5px}
.tally .slot{display:flex;align-items:flex-end;gap:4px;margin-right:12px}
.tally .tf{width:24px;text-align:center}
.tally .sum{font-weight:800;color:var(--red)}
.need{margin-top:7px;font-size:10.5px}
.need b{color:var(--red)}
.oath{padding-right:84px;display:flex;gap:9px;align-items:flex-start;margin-top:11px;font-size:10.5px;line-height:1.45}
.oath em{font-style:normal;font-weight:700}
.done{display:flex;align-items:flex-end;gap:9px;margin-top:11px;font-weight:700;font-size:11px}
.done .tf{width:96px}
.done .lbl{font-weight:500;color:var(--ink2);font-size:10px;margin-left:10px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:11px;border-top:1px solid var(--ink);font-size:10.5px;font-weight:700}
.foot a{color:var(--red);text-decoration:none}
.foot .pg{color:var(--ink2);font-weight:500}
.dd{position:absolute;overflow:visible}
.head .hero{margin-left:auto;flex:none;width:112px;height:104px;position:relative;top:10px;margin-top:-20px}
.quest{position:relative}
</style>
</head>

const GATE_SVG=`<svg data-doodle="gate" viewBox="-6 -6 112 112" width="86" height="96"></svg>`;
const stageName=n=>STAGES[n-1].name;
function stageHTML(d){
  const nw=d.w.words.length+d.w.coll.length+d.w.phr.length, n=d.n, total=d.g.length+d.u.length+1+nw, need=Math.ceil(total*0.8);

  const next=n<12?`<a data-link="etap-${n+1}">Ruszaj dalej: ${stageName(n+1)} →</a>`:`<a data-link="sala-chwaly">Sala Chwały →</a>`;

  <p class="quest">${d.quest}</p>
  <svg class="dd" data-doodle="${d.art.side}" viewBox="0 0 100 100" style="width:64px;height:64px;right:58px;top:206px;transform:rotate(-5deg)"></svg>

        <span class="slot">Gramatyka <span class="tf" data-f="txt" data-n="e${n}_g"></span>/ ${d.g.length}</span>
        <span class="slot">Umiejętności <span class="tf" data-f="txt" data-n="e${n}_u"></span>/ ${d.u.length}</span>
        <span class="slot">Wyzwanie <span class="tf" data-f="txt" data-n="e${n}_w"></span>/ 1</span>
        <span class="slot">Słownictwo <span class="tf" data-f="txt" data-n="e${n}_s"></span>/ ${nw}</span>
        <span class="slot sum">Razem <span class="tf" data-f="txt" data-n="e${n}_razem"></span>/ ${total}</span></div>

</section>`;

document.getElementById("stages").innerHTML=STAGE_DATA.map(stageHTML).join("");

const DDC={ink:"#2A3140", paper:"#FBFAF7", light:"#DCE7F5", blue:"#3768D8"};
// styl ryciny: cienki kontur, cieniowanie kreskami z prawej strony białych brył, „atrament” = gęste krzyżowe kreskowanie
let ddUid=0;
function ddPatterns(id,ppu){
  const g=3.3/ppu, lw=.62/ppu, gd=1.9/ppu;
  return `<pattern id="hl${id}" patternUnits="userSpaceOnUse" width="${g}" height="${g}" patternTransform="rotate(40)"><line x1="0" y1="0" x2="0" y2="${g}" stroke="${DDC.ink}" stroke-width="${lw}"/></pattern>
    <pattern id="hd${id}" patternUnits="userSpaceOnUse" width="${gd}" height="${gd}" patternTransform="rotate(40)"><line x1="0" y1="0" x2="0" y2="${gd}" stroke="${DDC.ink}" stroke-width="${lw*1.35}"/><line x1="0" y1="0" x2="${gd}" y2="0" stroke="${DDC.ink}" stroke-width="${lw*1.1}"/></pattern>`;
}
const VIGNETTE=[`n:<path d="M-6 92 H106"/>`,`n:<path d="M-2 92 l2 -5 l2 5 M6 92 l1.5 -4 l1.5 4 M98 92 l2 -5 l2 5 M90 92 l1.5 -4 l1.5 4"/>`,
  `n:<path d="M-4 97 H18 M30 98 H60 M76 97 H100"/>`];
function ddInner(name,ppu,id,paper=DDC.paper){
  const hero=name.endsWith("+"); if(hero) name=name.slice(0,-1);
  const sw=1.25/ppu;
  const parts=[...(hero?VIGNETTE:[]),...(DD[name]||[]),...(hero?[pine(-2,92,30,16,"w"),pine(8,92,22,12,"w")]:[])].map(s=>{const k=s.slice(0,s.indexOf(":")); return [k,s.slice(s.indexOf(":")+1)];});
  let out=`<defs>${ddPatterns(id,ppu)}</defs><g stroke="${DDC.ink}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round">`;
  parts.forEach(([k,e])=>{
    if(k==="w") out+=`<g fill="${paper}" class="sh" data-hl="hl${id}">${e}</g>`;
    else if(k==="b") out+=`<g fill="${DDC.light}">${e}</g>`;
    else if(k==="i") out+=`<g fill="${paper}">${e}</g><g fill="url(#hd${id})" stroke="none">${e}</g><g fill="none">${e}</g>`;
    else if(k==="bn") out+=`<g fill="none" stroke="#7FA0D4" stroke-width="${sw*.6}">${e}</g>`;
    else out+=`<g fill="none" stroke-width="${sw*.8}">${e}</g>`;
  });
  return out+"</g>";
}
function ddShade(root){ // kreskowanie prawych 40% każdej białej bryły
  root.querySelectorAll("g.sh").forEach(g=>{
    const shape=g.firstElementChild; if(!shape) return;
    const b=shape.getBBox(); if(b.width<6||b.height<6) return;
    const cid="c"+(++ddUid);
    const clip=document.createElementNS(NS,"clipPath"); clip.id=cid;
    const r=document.createElementNS(NS,"rect"); r.setAttribute("x",b.x+b.width*.6); r.setAttribute("y",b.y-2); r.setAttribute("width",b.width*.45); r.setAttribute("height",b.height+4);
    clip.appendChild(r); g.appendChild(clip);
    const over=shape.cloneNode(); over.setAttribute("fill",`url(#${g.dataset.hl})`); over.setAttribute("stroke","none"); over.setAttribute("clip-path",`url(#${cid})`); over.setAttribute("opacity",".5");
    shape.after(over);
  });
}
function drawDoodles(){ document.querySelectorAll("svg[data-doodle]").forEach(svg=>{
  const vb=svg.viewBox.baseVal, ppu=svg.getBoundingClientRect().width/vb.width, id="p"+(++ddUid);
  svg.innerHTML=ddInner(svg.dataset.doodle,ppu,id); ddShade(svg);
}); }
drawDoodles();

const INK="#2A3140", INK2="#5E6B80", RED="#3768D8", PARCH="#F7F6F2", SEA="#E1EBF6", SEAINK="#6F92C6";
let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
const R=(a,b)=>a+rnd()*(b-a);
const el=(id)=>document.getElementById(id);
function add(g,html){el(g).insertAdjacentHTML("beforeend",html);}
function smooth(p,closed){ // catmull-rom -> bezier
  const n=p.length; let d=`M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;
  const last=closed?n:n-1;
  for(let i=0;i<last;i++){
    const p0=p[(i-1+n)%n], p1=p[i], p2=p[(i+1)%n], p3=p[(i+2)%n];
    const q0=closed||i>0?p0:p1, q3=closed||i<n-2?p3:p2;
    const c1=[p1[0]+(p2[0]-q0[0])/6,p1[1]+(p2[1]-q0[1])/6], c2=[p2[0]-(q3[0]-p1[0])/6,p2[1]-(q3[1]-p1[1])/6];
    d+=` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d+(closed?"Z":"");
}
function roughen(pts,step,amp){ // podział + szum, żeby wybrzeże było postrzępione
  const out=[];
  for(let i=0;i<pts.length-1;i++){
    const [x1,y1]=pts[i],[x2,y2]=pts[i+1], L=Math.hypot(x2-x1,y2-y1), k=Math.max(1,Math.round(L/step));
    const nx=-(y2-y1)/L, ny=(x2-x1)/L;
    for(let j=0;j<k;j++){const t=j/k, a=(j===0?0:R(-amp,amp)); out.push([x1+(x2-x1)*t+nx*a, y1+(y2-y1)*t+ny*a]);}
  }
  out.push(pts[pts.length-1]); return out;
}

/* proste linie, zaokrąglone narożniki (tylko ścieżki z odcinków; krzywe bez zmian; bez lasu i twierdzy) */
function roundPoly(d,r0){
  if(/[QqCcSsTtAa]/.test(d)) return d;
  const tok=d.match(/[MLHVZmlhvz]|-?\d*\.?\d+(?:e-?\d+)?/g)||[]; let i=0, cmd="", x=0, y=0, sx=0, sy=0;
  const subs=[]; let cur=null;
  const num=()=>parseFloat(tok[i++]);
  while(i<tok.length){
    if(/[A-Za-z]/.test(tok[i])) cmd=tok[i++];
    const c=cmd;
    if(c==="Z"||c==="z"){ if(cur){cur.closed=true;} x=sx;y=sy; cmd=""; continue; }
    if(c==="M"||c==="m"){ const nx=num(),ny=num(); x=c==="m"?x+nx:nx; y=c==="m"?y+ny:ny; sx=x;sy=y; cur={pts:[[x,y]],closed:false}; subs.push(cur); cmd=c==="m"?"l":"L"; continue; }
    if(c==="L"||c==="l"){ const nx=num(),ny=num(); x=c==="l"?x+nx:nx; y=c==="l"?y+ny:ny; }
    else if(c==="H"||c==="h"){ const nx=num(); x=c==="h"?x+nx:nx; }
    else if(c==="V"||c==="v"){ const ny=num(); y=c==="v"?y+ny:ny; }
    else return d;
    cur.pts.push([x,y]);
  }
  return subs.map(({pts,closed})=>{
    if(closed && pts.length>1){const f=pts[0],l=pts[pts.length-1]; if(Math.hypot(f[0]-l[0],f[1]-l[1])<.01) pts.pop();}
    const n=pts.length; if(n<3) return "M"+pts.map(p=>p.map(v=>v.toFixed(2)).join(",")).join(" L");
    const corner=(k)=>{const p=pts[k], a=pts[(k-1+n)%n], b=pts[(k+1)%n];
      const la=Math.hypot(p[0]-a[0],p[1]-a[1]), lb=Math.hypot(b[0]-p[0],b[1]-p[1]), r=Math.min(r0,la/3,lb/3);
      const p1=[p[0]+(a[0]-p[0])/la*r, p[1]+(a[1]-p[1])/la*r], p2=[p[0]+(b[0]-p[0])/lb*r, p[1]+(b[1]-p[1])/lb*r];
      return [p1,p,p2];};
    const f=(q)=>q[0].toFixed(2)+","+q[1].toFixed(2);
    let out="";
    if(closed){ const c0=corner(0); out="M"+f(c0[2]);
      for(let k=1;k<n;k++){const [p1,p,p2]=corner(k); out+=` L${f(p1)} Q${f(p)} ${f(p2)}`;}
      out+=` L${f(c0[0])} Q${f(c0[1])} ${f(c0[2])}Z`; }
    else { out="M"+f(pts[0]);
      for(let k=1;k<n-1;k++){const [p1,p,p2]=corner(k); out+=` L${f(p1)} Q${f(p)} ${f(p2)}`;}
      out+=" L"+f(pts[n-1]); }
    return out;
  }).join(" ");
}
function inkify(root){
  root.querySelectorAll("g.mi").forEach(icon=>{
    if(["forest","fortress"].includes(icon.dataset.ic)) return;
    icon.querySelectorAll("path").forEach(path=>path.setAttribute("d",roundPoly(path.getAttribute("d")||"",2.2)));
  });
}

document.fonts.ready.then(()=>{
  const pages=[...document.querySelectorAll(".page")], ids=pages.map(p=>p.id), out=[], links=[]; let k=0;
  pages.forEach((p,pi)=>{
    const pr=p.getBoundingClientRect(), s=595.2756/pr.width;
    const box=r=>({x:(r.left-pr.left)*s,y:(r.top-pr.top)*s,w:r.width*s,h:r.height*s});
    p.querySelectorAll("[data-f]").forEach(e=>out.push({page:pi,type:e.dataset.f,name:e.dataset.n||`${e.dataset.f}_${++k}`,...box(e.getBoundingClientRect())}));
    p.querySelectorAll("[data-link]").forEach(e=>{
      const r=e.getBoundingClientRect(), b=box(r), pad=3;
      links.push({page:pi,target:ids.indexOf(e.dataset.link),to:e.dataset.link,x:b.x-pad,y:b.y-pad,w:b.w+2*pad,h:b.h+2*pad});
    });
  });
  el("fieldsjson").textContent=JSON.stringify({pages:pages.length,fields:out,links});
  document.body.dataset.ready="1";
});
